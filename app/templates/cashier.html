<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Simulator</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col relative overflow-hidden bg-black/20" data-page="cashier">
  <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
    <img src="{{ url_for('static', filename='images/wipStoreInside.png') }}" class="absolute inset-0 w-full h-full object-cover render-pixel opacity-30">
  </div>

  <main class="flex flex-col items-center">
    <div style="display: flex; align-items: center;">
      <div style="position: relative; width: 900px; height: 450px;">
        <img src="/static/images/body/body-blue.png" style="position: absolute; top: -30%; left: 0%; width: 40%; height: 100%; image-rendering: pixelated;"/>
        <img src="/static/images/eyes/eyes-joyful.png" style="position: absolute; top: -30%; left: 0%; width: 40%; height: 100%; image-rendering: pixelated;"/>
        <img src="/static/images/mouth/mouth-u.png" style="position: absolute; top: -30%; left: 0%; width: 40%; height: 100%; image-rendering: pixelated;"/>
        <img src="/static/images/cash_register.png" style="position: absolute; top: -2.5%; left: 0%; width: 100%; height: 100%; image-rendering: pixelated;"/>
      </div>
      <div class="character" style="position: relative; width: 300px; height: 300px;">
        <img data-art-layer="body" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated;" src=""/>
        <img data-art-layer="eyes" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated;" src=""/>
        <img data-art-layer="mouth" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated;" src=""/>
        <img data-art-layer="accessories" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; image-rendering: pixelated;" src=""/>
      </div>
    </div>
    <script src="{{ url_for('static', filename='js/animate.js') }}"></script>
    <section class="flex flex-row mx-auto text-center text-2xl items-center justify-center">
      <div class = "flex px-8">
        <p id="main" class=""> ... </p>
      </div>
      <div class = "flex flex-col px-8">
        <p id="main2"> ... </p>
        <section class = "flex flex-col">
          <div class ="flex flex-row">
            <input id="numpad_1" type="button" value ="1" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_2" type="button" value ="2" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_3" type="button" value ="3" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
          </div>
          <div class ="flex flex-row">
            <input id="numpad_4" type="button" value ="4" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_5" type="button" value ="5" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_6" type="button" value ="6" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
          </div>
          <div class ="flex flex-row">
            <input id="numpad_7" type="button" value ="7" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_8" type="button" value ="8" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_9" type="button" value ="9" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
          </div>
          <div class ="flex flex-row">
            <input id="numpad_decimal" type="button" value ="." class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_0" type="button" value ="9" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
            <input id="numpad_clear" type="button" value ="C" class="px-4 hover:text-gray-300 hover:-translate-y-1 transition">
          </div>
            <input id="numpad_submit" type="button" placeholder="1">
        </section>
        <input id="changeInput" type="number" placeholder="Enter change">
        <button id="submitChange" class="select-none hover:text-gray-300 hover:-translate-y-1 transition letter-hover-text">Give Change</button>
        <button id="advanceGame" class="select-none hover:text-gray-300 hover:-translate-y-1 transition letter-hover-text">Next</button>
        <!--<button id="nextCustomer" class="select-none hover:text-gray-300 hover:-translate-y-1 transition">Next Customer</button> -->
      </div>
    </section>
  </main>

  <footer class="mb-12 pr-6 pt-6 text-center text-sm/8 text-gray-100">
      <a href="https://github.com/bgels/RestaurantSimulator" class="select-none hover:text-gray-300 transition">
      Made by Resturant Simulator, SoftDev P04 | 2026
      </a>
  </footer>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/animate.js') }}"></script>
</body>
</html>
