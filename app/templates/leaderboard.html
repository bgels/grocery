<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Simulator</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--steam-bg)]">
    <h2 class="mx-auto text-center text-2xl">Costgo!!</h2>
    
    <form method="GET" action="/leaderboard">
        <label>Sort by:</label>

        <select name="sort" onchange="this.form.submit()">
            <option value="revenue" {% if sort_by == "revenue" %}selected{% endif %}>Revenue</option>
            <option value="money" {% if sort_by == "money" %}selected{% endif %}>Money</option>
            <option value="served" {% if sort_by == "served" %}selected{% endif %}>Served</option>
            <option value="killed" {% if sort_by == "killed" %}selected{% endif %}>Killed</option>
            <option value="day" {% if sort_by == "day" %}selected{% endif %}>Day</option>
        </select>
    </form>
    <br>

    <table border="1">
    <tr>
        <th>Rank</th>
        <th>Username</th>
        <th>Revenue</th>
        <th>Money</th>
        <th>Served</th>
        <th>Killed</th>
        <th>Day</th>
    </tr>
    {% for player in leaderboard %}
    <tr>
        <td>{{ loop.index }}</td>
        <td>{{ player[0] }}</td> 
        <td>{{ player[1] }}</td>
        <td>{{ player[2] }}</td>
        <td>{{ player[3] }}</td>
        <td>{{ player[4] }}</td>
        <td>{{ player[5] }}</td>
    </tr>
    {% endfor %}
    </table>

  <footer class="mb-12 pr-6 pt-6 text-center text-sm/8 text-gray-100">
      <a href="https://github.com/bgels/RestaurantSimulator" class="select-none hover:text-gray-300 transition">
      Made by Restaurant Simulator, SoftDev P04 | 2026
      </a>
  </footer>
</body>
</html>
