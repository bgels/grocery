<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Simulator</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class=" min-h-screen flex flex-col relative" data-page="manager">
  <div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">
    <img src="{{ url_for('static', filename='images/table.png') }}">
  </div>
  </div>

  <h2 class="mx-auto text-center text-2xl">Manager!!</h2>
  <main class="flex flex-col items-center justify-center">
    <div style="display: flex; gap: 50px; align-items: center;">
    </div>

  <section class="grid grid-cols-3 gap-8 mx-auto w-full px-8 text-center text-xl items-start justify-center">

  <div class="paper p-4 min-h-[260px] text-left">
    <h3 class="text-2xl mb-4">Store Info</h3>
    <p id="main">Hasnt been changed</p>
  </div>

  <div class="paper flex flex-col px-4">
    <div id="productGrid" class="grid grid-cols-2 gap-4 pb-4">
      <div class="col-span-2 text-left text-lg font-bold text-yellow-400 mt-2 mb-1 border-b border-gray-700 pb-1">Upgrades</div>
      <div class="col-span-2 text-left text-lg font-bold text-green-400 mt-4 mb-1 border-b border-gray-700 pb-1">Items</div>
      <div class="col-span-2 text-left text-lg font-bold text-blue-400 mt-4 mb-1 border-b border-gray-700 pb-1">Products</div>
    </div>
  </div>

  <div class="flex flex-col px-4 gap-4">
    <h3 class="text-2xl mb-4">Selected Item</h3>

    <div class="paper p-4 min-h-[260px] text-left">
      <p id="selectedProductName" class="text-2xl mb-3 text-center">Select an item</p>
      <p id="selectedProductOwned">Owned: --</p>
      <p id="selectedProductBuyPrice">Buy Price: --</p>
      <p id="selectedProductSellPrice">Sell Price: --</p>
      <p id="selectedProductTotal" class="mt-2 text-green-400">Total Cost: --</p>

      <div class="flex flex-row mt-8 px-4 gap-4 items-center">
        <button id="buySelectedStock" class="flex border px-4 py-2 rounded hover:bg-gray-200 hover:text-black transition hidden">
          Buy
        </button>
        
        <div id="amountSelectorContainer" class="flex justify-center gap-2 hidden">
          <button class="select-none border px-3 py-1 rounded buyAmountButton hover:bg-gray-200 hover:text-black transition" data-amount="1">x1</button>
          <button class="select-none border px-3 py-1 rounded buyAmountButton hover:bg-gray-200 hover:text-black transition" data-amount="5">x5</button>
          <button class="select-none border px-3 py-1 rounded buyAmountButton hover:bg-gray-200 hover:text-black transition" data-amount="10">x10</button>
        </div>
      </div>
    </div>

    <p id="main2" class="text-left text-m text-gray-400">This hasn't been changed</p>
    <button id="advanceGame" class="select-none border border-gray-400 px-4 py-2 rounded hover:bg-gray-200 hover:text-black hover:-translate-y-1 transition">
      Next
    </button>
  </div>
  </section>
  </main>

  <footer class="mb-12 pr-6 pt-6 text-center text-sm/8 text-gray-100">
      <a href="https://github.com/bgels/RestaurantSimulator" class="select-none hover:text-gray-300 transition">
      Made by Resturant Simulator, SoftDev P04 | 2026
      </a>
  </footer>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/animate.js') }}"></script>
</body>
</html>
