<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grocery Simulator</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/tailwindcss.js') }}"></script>
</head>


<body class="register min-h-screen bg-[#1a1a24] flex items-center justify-center font-sans text-gray-900 select-none" data-page="manager">
  
  <main class="relative w-full max-w-[1920px] aspect-video overflow-hidden shadow-2xl">
    
    <img src="{{ url_for('static', filename='images/manager.png') }}" class="absolute inset-0 w-full h-full object-fill render-pixel pointer-events-none -z-10">

    <section class="absolute top-[12%] left-[8%] w-[35%] h-[73%] overflow-y-auto px-6 py-4">
      <div id="productGrid" class="grid grid-cols-2 lg:grid-cols-3 gap-6 pb-8 pt-4">
        
        <div class="col-span-full text-left text-xl font-bold text-yellow-700 mt-2 mb-1 border-b border-gray-400 pb-2">Upgrades</div>
        <div class="col-span-full text-left text-xl font-bold text-green-700 mt-6 mb-1 border-b border-gray-400 pb-2">Items</div>
        <div class="col-span-full text-left text-xl font-bold text-blue-700 mt-6 mb-1 border-b border-gray-400 pb-2">Products</div>
      
      </div>
    </section>

    <section class="flash absolute top-[11%] left-[49%] w-[22%] h-[31%] flex flex-col items-center justify-center px-4 text-center">
        <p id="main" class="text-lg font-medium">Hasn't been changed</p>
        <p id="main2" class="text-sm text-gray-600 mt-2 mb-4">This hasn't been changed</p>
        
        <button id="advanceGame" class="mt-2 select-none border-2 border-gray-800 px-6 py-2 rounded hover:bg-gray-800 hover:text-white transition font-bold shadow-sm">
          Next DAY
        </button>
    </section>

    <section class="absolute top-[56%] left-[49%] w-[43%] h-[30%] px-8 py-4 flex flex-col justify-between">
        
        <div class="w-full">
          <p id="selectedProductName" class="text-xl font-bold mb-1 border-b border-gray-400 pb-2 text-center">Select an item</p>

          <div class="flex justify-center max-h-[96px]">
            <img id="selectedProductImage" class="w-24 h-24 render-pixel hidden" src="" onerror="this.style.display='none'">
          </div>
          <div class="grid grid-cols-2 gap-4 text-lg px-4">
            <div class="flex flex-col gap-1">
              <p id="selectedProductOwned">Owned: --</p>
              <p id="selectedProductBuyPrice">Buy Price: --</p>
            </div>
            <div class="flex flex-col gap-1">
              <p id="selectedProductSellPrice">Sell Price: --</p>
              <p id="selectedProductTotal" class="text-green-700 font-bold">Total Cost: --</p>
            </div>
          </div>
        </div>

        <div class="flex flex-col gap-3 items-center mt-2">
          <button id="buySelectedStock" class="w-1/2 border-2 border-gray-800 px-4 py-2 rounded hover:bg-gray-800 hover:text-white transition hidden font-bold">
            Buy
          </button>
          
          <div id="amountSelectorContainer" class="flex justify-center gap-3 hidden">
            <button class="select-none border-2 border-gray-800 px-4 py-1 rounded buyAmountButton hover:bg-gray-800 hover:text-white transition font-bold" data-amount="1">x1</button>
            <button class="select-none border-2 border-gray-800 px-4 py-1 rounded buyAmountButton hover:bg-gray-800 hover:text-white transition font-bold" data-amount="5">x5</button>
            <button class="select-none border-2 border-gray-800 px-4 py-1 rounded buyAmountButton hover:bg-gray-800 hover:text-white transition font-bold" data-amount="10">x10</button>
          </div>
        </div>

    </section>
  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/animate.js') }}"></script>
  </main>
   <div class="fixed left-6 top-1/2 -translate-y-1/2 flex flex-col gap-4">
    <a href="/"
       class="group flex items-center justify-center w-14 h-14 rounded-full bg-blue-500 text-white overflow-hidden transition-all duration-300 hover:w-40 hover:rounded-2xl">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 12l9-9 9 9M5 10v10h14V10"/>
        </svg>

        <span class="max-w-0 overflow-hidden whitespace-nowrap transition-all duration-300 group-hover:max-w-24 group-hover:ml-3">
            Home
        </span>
    </a>
    <a href="/settings"
       class="group flex items-center justify-center w-14 h-14 rounded-full bg-gray-700 text-white overflow-hidden transition-all duration-300 hover:w-40 hover:rounded-2xl">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M11.983 5.25a1.5 1.5 0 013.034 0l.168 1.2a6.75 6.75 0 012.007.831l1.106-.493a1.5 1.5 0 011.964.803l.72 1.56a1.5 1.5 0 01-.488 1.888l-.938.77a6.78 6.78 0 010 1.662l.938.77a1.5 1.5 0 01.488 1.888l-.72 1.56a1.5 1.5 0 01-1.964.803l-1.106-.493a6.75 6.75 0 01-2.007.831l-.168 1.2a1.5 1.5 0 01-3.034 0l-.168-1.2a6.75 6.75 0 01-2.007-.831l-1.106.493a1.5 1.5 0 01-1.964-.803l-.72-1.56a1.5 1.5 0 01.488-1.888l.938-.77a6.78 6.78 0 010-1.662l-.938-.77a1.5 1.5 0 01-.488-1.888l.72-1.56a1.5 1.5 0 011.964-.803l1.106.493a6.75 6.75 0 012.007-.831l.168-1.2z"/>
        </svg>

        <span class="max-w-0 overflow-hidden whitespace-nowrap transition-all duration-300 group-hover:max-w-24 group-hover:ml-3">
            Settings
        </span>
    </a>

    <a href="/logout"
       class="group flex items-center justify-center w-14 h-14 rounded-full bg-red-500 text-white overflow-hidden transition-all duration-300 hover:w-40 hover:rounded-2xl">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="w-6 h-6 flex-shrink-0"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H9m4 8H5a2 2 0 01-2-2V6a2 2 0 012-2h8"/>
        </svg>

        <span class="max-w-0 overflow-hidden whitespace-nowrap transition-all duration-300 group-hover:max-w-24 group-hover:ml-3">
            Logout
        </span>
    </a>

</div>
</body>
</html>
